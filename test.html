<!DOCTYPE html>
<html><head><title>Audio Pipeline Debug</title></head>
<body style="background:#111;color:#eee;font-family:monospace;padding:20px">
<h2>SoundWarp Audio Debug</h2>
<button id="btn" style="padding:12px 24px;font-size:16px;cursor:pointer">Run Test</button>
<pre id="log" style="margin-top:20px;white-space:pre-wrap"></pre>
<script type="module">
import * as Tone from '/node_modules/tone/build/esm/index.js';

const log = document.getElementById('log');
const btn = document.getElementById('btn');
function l(msg) { log.textContent += msg + '\n'; console.log(msg); }

btn.onclick = async () => {
  btn.disabled = true;
  try {
    l('1. Creating AudioContext...');
    const ctx = new AudioContext({ sampleRate: 44100 });
    if (ctx.state === 'suspended') await ctx.resume();
    l('   OK: ' + ctx.state);

    l('2. Fetching track metadata...');
    const proxyBase = `http://${window.location.hostname}:8788`;
    const metaRes = await fetch(`${proxyBase}/api/deezer/track/786717`);
    const meta = await metaRes.json();
    l('   Title: ' + meta.title + ' - ' + meta.artist?.name);
    l('   Preview: ' + (meta.preview ? 'YES' : 'NO'));
    if (!meta.preview) { l('FAIL: No preview URL'); return; }

    l('3. Fetching audio via proxy...');
    const audioRes = await fetch(`${proxyBase}/api/preview?url=${encodeURIComponent(meta.preview)}`);
    l('   HTTP ' + audioRes.status + ', size: ' + audioRes.headers.get('content-length'));
    if (!audioRes.ok) { l('FAIL: Proxy returned ' + audioRes.status); return; }
    const arrayBuffer = await audioRes.arrayBuffer();
    l('   ArrayBuffer: ' + arrayBuffer.byteLength + ' bytes');

    l('4. Decoding audio...');
    const sourceBuffer = await ctx.decodeAudioData(arrayBuffer);
    l('   Duration: ' + sourceBuffer.duration.toFixed(1) + 's, channels: ' + sourceBuffer.numberOfChannels);

    l('5. Testing Tone.Offline (no effects)...');
    const clean = await Tone.Offline(({ transport }) => {
      const player = new Tone.Player(sourceBuffer);
      player.toDestination();
      transport.start();
      player.start(0);
    }, sourceBuffer.duration);
    l('   OK: rendered ' + clean.duration.toFixed(1) + 's');

    l('6. Testing Tone.Offline + PitchShift...');
    const pitched = await Tone.Offline(({ transport }) => {
      const player = new Tone.Player(sourceBuffer);
      const ps = new Tone.PitchShift(5);
      ps.toDestination();
      player.connect(ps);
      transport.start();
      player.start(0);
    }, sourceBuffer.duration);
    l('   OK: rendered ' + pitched.duration.toFixed(1) + 's');

    l('7. Testing Tone.Offline + Reverb...');
    const reverbed = await Tone.Offline(async ({ transport }) => {
      const player = new Tone.Player(sourceBuffer);
      const reverb = new Tone.Reverb({ decay: 0.8, wet: 0.5 });
      await reverb.ready;
      reverb.toDestination();
      player.connect(reverb);
      transport.start();
      player.start(0);
    }, sourceBuffer.duration);
    l('   OK: rendered ' + reverbed.duration.toFixed(1) + 's');

    l('8. Testing playback...');
    const buf = clean.get();
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    l('   Playing clean version!');

    l('\n✅ ALL TESTS PASSED');
  } catch(e) {
    l('\n❌ ERROR: ' + e.message);
    l('Stack: ' + e.stack);
  }
};
</script>
</body></html>
